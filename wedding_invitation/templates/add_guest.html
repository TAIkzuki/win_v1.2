
{% extends "base.html" %}
{% block content %}
<section class="card narrow">
<h2>Добавить гостя</h2>
<form method="post">
<label>Имя</label>
<input name="name" placeholder="Андрей" required>
<label>Количество приглашённых</label>
<input name="invited_count" type="number" min="1" max="20" value="1" required>
<button class="button" type="submit">Создать приглашение</button>
</form>
<a href="{{ url_for('admin') }}">← Назад</a>
{% for msg in get_flashed_messages() %}<p class="error">{{ msg }}</p>{% endfor %}
</section>
{% endblock %}
